# docker-compose.yml — BitFlow Full Stack Deployment (Frontend + FastAPI Backend)
#
# Usage:
#   docker compose up -d --build     # start everything in background
#   docker compose down              # stop containers

services:
  # ── FastAPI Backend (Python 3.11 + Icarus Verilog compiler) ──────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bitflow-api
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      - TIMEOUT_SECONDS=30
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Next.js Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./bitflow_frontend
      dockerfile: Dockerfile
    container_name: bitflow-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://api:8080
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - bitflow-data:/app/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  bitflow-data:


